<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="shortcut icon" href="../icons/icon_document.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>BookSpace</title>
</head>

<body onload="carregarMetricas(), carregarTotalPaginas()">
    <header>
        <nav class="navbar">
            <img src="../icons/4.png" alt="" class="logo_navbar">
            <a href="../home_usuario.html" class="home_btn">Home</a>
            <a href="../dashboard.html" class="dash_btn">Dashboard</a>
            <a href="../biblioteca.html" class="biblioteca_btn">Minha Biblioteca</a>
            <a href="../sorteador.html" class="sorteador_btn">Sorteador</a>
            <img onclick="redirecionar()" src="../icons/11.png" alt="" class="img_login">
        </nav>
    </header>

    <div class="bloco1">
        <div class="bloco_inserir">
             Meta de leitura anual
            <input placeholder="Insira sua meta" class="input_meta" id="input_meta" type="text">
            <button onclick="InserirMeta()" class="bnt_meta">inserir</button>
        </div>
                
        <div class="meta_leitura">
            <div class="bloco_meta">
                 
                <div class="texto_meta">
                    Meta de leitura<br>
                para este ano<br>
                </div>

                <div id="metrica_leitura" class="metrica_leitura"></div>
            </div>

            <div class="grafico_dunut">
                <canvas id="grafico_meta"></canvas>
            </div>
        </div>

        <div class="paginas_lidas">
            <div class="texto1_paginas_lidas">
                Páginas Lidas em <br>2026
            </div>

            <div id="metrica_paginas_lidas" class="metrica_paginas_lidas"></div>
        </div>
    </div>

    <div class="bloco_2">
        <div class="grafico_barras1">
            <canvas id="grafico_generos"></canvas>
        </div>

        <div class="grafico_barras2">
            <canvas id="grafico_lidos"></canvas>
        </div>
    </div>

    <div class="bloco_3">
            <div class="bloco_classificacao">Você é o TOP<br>
                #2 leitores<br>
                do BookSpace<br>
            </div>
    </div>

    <div class="futter">
        
        <div class="img_futter">
            <a href="https://github.com/Thamyressilvacode"><img class="img_github" src="../icons/6.png" alt=""></a>
            <a href="https://www.linkedin.com/in/thamyres-batista-0ab3b4216/"><img class="img_linkedin" src="../icons/7.png" alt=""></a>
        </div>
        
        <div class="texto_futter">
            Projeto Desenvolvido Para Fins Educacionais por Thamyres Batista
        </div>
    </div>
</body>
</html>

<script>
//funcao do botao de logout
    function redirecionar(){
        window.location = "home.html"
    }

// inserir meta no banco
    function InserirMeta(){
        let meta = Number(input_meta.value);
        let idUsuario = sessionStorage.getItem("ID_USUARIO");


        fetch(`/dashboard/btnInserirMeta/${idUsuario}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                metaServer: meta
            })
        })
        .catch(function (erro) {
            console.log(erro);
        });
    }
    function carregarMetricas(){
        let idUsuario = sessionStorage.getItem("ID_USUARIO");

        fetch(`/dashboard/carregarMeta/${idUsuario}`)
        .then((res) => res.json())
        .then((dados) => {
            console.log(dados);
            metrica_leitura.innerHTML = `
                Meta: ${dados[0].metaLivros} livros
            `;
        })
        .catch((erro) => {
            console.log("Erro: ", erro);
        });
    }
    
    function carregarTotalPaginas(){
    let idUsuario = sessionStorage.getItem("ID_USUARIO");

    fetch(`/dashboard/carregarTotalPaginas/${idUsuario}`)
    .then((res) => res.json())
    .then((dados) => {
        console.log(dados);
        metrica_paginas_lidas.innerHTML = `${dados[0].totalPaginas} páginas`;
    })
    .catch((erro) => {
        console.log("Erro: ", erro);
    });
}


// grafico de meta

    const meta = document.getElementById('grafico_meta');

    const centerTextPlugin = {
      id: 'centerText',
      beforeDraw: function(chart) {
        const { ctx: metaCtx, chartArea: { width, height } } = chart;
        
        const lidos = chart.data.datasets[0].data[0];
        const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
        const porcentagem = Math.round((lidos / total) * 100);

        metaCtx.save();
        metaCtx.font = 'bold 30px Julius Sans One';
        metaCtx.textAlign = 'center';
        metaCtx.textBaseline = 'middle';
        metaCtx.fillStyle = '#fff9e8';
        
        const centerX = width / 2;
        const centerY = height / 2 + 5;
        
        metaCtx.fillText(porcentagem + '%', centerX, centerY);
        metaCtx.restore();
      }
    };

    new Chart(meta, {
      type: 'doughnut',
      data: {
        labels: ['Livros Lidos', 'Livros Não Lidos'],
        datasets: [{
          data: [50, 50],
          backgroundColor: ['#ee3a86', '#fefcd0'],
          borderWidth: 0,
          borderRadius: 10,
          hoverOffset: 20
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        cutout: '70%',
        
        plugins: {
          legend: {
            display: false
          }
        }
      } ,
      plugins: [centerTextPlugin]
    });

//grafico generos

    let ctxBarra = document.getElementById("grafico_generos").getContext("2d")
    new Chart(ctxBarra, {
        type: "bar",
        data: {
            labels: ["Romance", "Fantasia", "Terror", "Auto Ajuda","Suspense","Drama"],
            datasets: [{
                data: [20, 14, 7, 4,3,4],
                backgroundColor: ["#ffbd59"],
                barPercentage: 1.0,
                borderRadius: 15

            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display:false}
            },
            scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true }
            }
        }
    })

//grafico lidos

let lidos = document.getElementById("grafico_lidos").getContext("2d")
    new Chart(lidos, {
        type: "bar",
        data: {
            labels: ["Janeiro", "Fevereiro", "Março", "Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"],
            datasets: [{
                data: [5,7,4,3,2,4,6,8,4,3,4,2],
                backgroundColor: ["#ef737c","#ffbd59","#ffde59","#aac861","#77d268","#78e9ca","#5cd4d3","#6193c8","#786dd2","#c184d7","#d264bd","#ff749a"],
                barPercentage: 1.0,
                borderRadius: 15
            }]
        },
        options: {
            indexAxis: 'x',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display:false}
            },
            scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true }
            }
        }
    })

</script>
