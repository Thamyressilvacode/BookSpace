<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/login.css">
    <title>BookSpace</title>
</head>
<body>
    <div class="full">
        
        <h1><img src="./icons/2.png" alt=""></h1>

        <div class="acesso_cl">

            <div class="img_icon"><img src="./icons/1.png" alt=""></div>

            <h2>LOGIN</h2>

            <div class="inputs_div">
                <h3>Email</h3>
            <input type="text" id="emailLogin_ipt"><br>
            <h3>Senha</h3>
            <input type="password" id="senhaLogin_ipt"><br>
            </div>

        

            <button id="entrarLogin_btn" onclick="Entrar()">Entrar</button><br>
            <button id="cadastrarLogin_btn" onclick="Cadastrar()">Não tenho login</button>

        </div>

    </div>
    
    <div class="img_class">
    </div>

<script>
function Entrar() {

    var emailVar = emailLogin_ipt.value;
    var senhaVar = senhaLogin_ipt.value;

    // Validação
    if (emailVar == "" || senhaVar == "") {
        alert("Preencha todos os campos!");
        return;
    }

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    })
    .then(function (resposta) {
        if (resposta.ok) {

            resposta.json().then(json => {
                console.log(json);

                // Salvando dados do usuário
                sessionStorage.ID_USUARIO = json.idusuario;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.EMAIL_USUARIO = json.email;

                alert("Login realizado com sucesso!");

                // Redireciona (ajuste para sua página principal)
                window.location = "dashboard.html";
            });

        } else {
            resposta.text().then(texto => {
                alert(texto);
            });
        }
    })
    .catch(function (erro) {
        console.log(erro);
    });

}

// Botão "Não tenho login"
function Cadastrar() {
    window.location = "cadastro.html";
}
</script>
</body>
</html>
