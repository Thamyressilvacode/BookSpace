<script>
//funcao do botao de logout
    function redirecionar(){
        window.location = "home.html"
    }

    function carregarReview(){
    let idLivro = sessionStorage.getItem("ID_LIVRO")


    fetch(`/review/carregarReview/${idLivro}`)
    .then((res) => res.json())
    .then((dados) => {

        console.log(dados)
        for(let i = 0; i < dados.length; i++){
            let idLivros = Number(dados[i].idLivros)

            bloco_review.innerHTML = `
                <h1>Review</h1>
                <div class="titulo_review">${dados[i].titulo}</div>
                <div class="nota">Nota: ${parseFloat(dados[i].nota).toFixed(1)}</div>
                <div class="texto_review">${dados[i].review}</div>
            `;
        }
    })
    .catch((erro) => {
      console.log("Erro: ", erro);
    });
}
</script>
