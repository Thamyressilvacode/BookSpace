<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/biblioteca.css">
    <link rel="shortcut icon" href="../icons/icon_document.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>BookSpace</title>
</head>
<body onload="carregarLivro()">
    <header>
        <nav class="navbar">
            <img src="../icons/4.png" alt="" class="logo_navbar">
            <a href="../home_usuario.html" class="home_btn">Home</a>
            <a href="../dashboard.html" class="dash_btn">Dashboard</a>
            <a href="../biblioteca.html" class="biblioteca_btn">Minha Biblioteca</a>
            <img onclick="redirecionar()" src="../icons/11.png" alt="" class="img_login">
        </nav>
    </header>

    <H1>Biblioteca</H1>

    <div class="titulo_review">REVIEWS</div>
    
    <div class="inserir">
        <div class="inserir">
            <button class="inserir_btn">+inserir novo livro</button>
        </div>
    </div>

    
<div class="titulo_visualizacao">
        <div>titulo</div>
        <div>Nota</div>
</div>

</div>

    <div class="lista_livros" id="lista_livros"></div>

    <div id="modal_novo_livro" class="modal_review">  
    <div class="modal_interno">
        <h2 class="h2_modal">INSERIR NOVO LIVRO</h2>

        <label>Título do Livro</label>
        <input type="text" id="novo_titulo" placeholder="Ex: Amor Corrompido">

        <label>Autor</label>
        <input type="text" id="novo_autor" placeholder="Ex:Ana">

        <label>Review</label>
        <textarea type="text" class="nova_review" id="nova_review" placeholder="Insira sua review..."></textarea>

        <div class="bloco_nota_genero">
            <label>Nota (0 a 10)</label>
            <input type="number" id="novo_nota" min="0" max="10"value="" placeholder="0">

            <label>Genero livro</label>
            <input type="text" id="genero_livro" class="genero_livro" placeholder="Ex: Romance">

            <label >Quantidade de páginas</label>
            <input type="number" id="quantidade_paginas" class="quantidade_paginas" placeholder="100">
        </div>

        <div class="modal_btn">
            <button class="btn_cancelar" onclick="fecharModal()">Cancelar</button>
            <button class="btn_inserir" onclick="adicionarNovoLivro()">Inserir Livro</button>
        </div>
    </div>
    </div>

    <div class="futter">
        
        <div class="img_futter">
            <a href="https://github.com/Thamyressilvacode"><img class="img_github" src="../icons/6.png" alt=""></a>
            <a href="https://www.linkedin.com/in/thamyres-batista-0ab3b4216/"><img class="img_linkedin" src="../icons/7.png" alt=""></a>
        </div>
        
        <div class="texto_futter">
            Projeto Desenvolvido Para Fins Educacionais por  Thamyres Batista
        </div>
    </div>

</body>
</html>
<script>
//FUNCAO LOGOUT NAV BAR
    function redirecionar(){
        window.location = "home.html"
    }

//VARIAVEIS INSERIR LIVRO
let btnInserir = document.querySelector('.inserir_btn');
let listaLivros = document.getElementById('lista_livros');
let modalNovoLivro = document.getElementById('modal_novo_livro');
let modalReview = document.getElementById('modal_review');

// ABRE O MODAL DE INSERIR LIVRO
btnInserir.addEventListener('click', () => {
    modalNovoLivro.style.display = 'flex';
});

//FECHA O MODAL DE INSERIR LIVRO E LIMPOA OS CAMPOS PARA A PROXIMA REVIEW
function fecharModal() {
    modalNovoLivro.style.display = 'none';

    document.getElementById('novo_titulo').value = '';
    document.getElementById('novo_autor').value = '';
    document.getElementById('nova_review').value = '';
    document.getElementById('novo_nota').value = '';
    document.getElementById('genero_livro').value = '';
}

// botao de adicionar livro no banco
function adicionarNovoLivro() {
    let titulo = novo_titulo.value;
    let review = nova_review.value;
    let autor = novo_autor.value;
    let genero = genero_livro.value;
    let nota = Number(novo_nota.value);
    let paginas = Number(quantidade_paginas.value);
    let idUsuario = sessionStorage.getItem("ID_USUARIO");

    fetch(`/biblioteca/salvarReview/${idUsuario}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            tituloServer: titulo,
            autorServer: autor,
            generoServer: genero,
            paginasServer: paginas,
            notaServer: nota,
            reviewServer: review,
        })
    })
    .then(() => {
        listaLivros.innerHTML = ''; // limpa a lista
        carregarLivro();            // recarrega com o novo livro
        fecharModal();
    })
    .catch(function (erro) {
        console.log(erro);
    });
}

function carregarLivro(){
    let idUsuario = sessionStorage.getItem("ID_USUARIO")


    fetch(`/biblioteca/carregarLivro/${idUsuario}`)
    .then((res) => res.json())
    .then((dados) => {

        console.log(dados)
        for(let i = 0; i < dados.length; i++){
            let idLivros = Number(dados[i].idLivros)
            let novoBook = document.createElement('div');
            novoBook.className = 'novoBook';

            novoBook.innerHTML = `
                <div class="title">${dados[i].titulo}</div>
                <div class="nota">Nota: ${parseFloat(dados[i].nota).toFixed(1)}</div>
                <button onclick="btn_review(${idLivros})" class="btn_review">REVIEW</button>
            `;

            listaLivros.appendChild(novoBook);
        }
    })
    .catch((erro) => {
      console.log("Erro: ", erro);
    });
}

// Função que adiciona o evento no botão REVIEW
function btn_review(idLivro){
    sessionStorage.ID_LIVRO = idLivro 
        window.location = "tela_review.html"
    }
</script>
