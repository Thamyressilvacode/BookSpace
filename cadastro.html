<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/cadastro.css">
    <title>BookSpace</title>
</head>
<body>

    <div class="img_class"></div>
    
    <div class="full">
        
        <h1><img src="./icons/2.png" alt=""></h1>

        <div class="cadastro_class">

            <div class="img_icon"><img src="./icons/3.png" alt=""></div>

            <h2>CADASTRO</h2>

            <div class="inputs_div">
                <h3>Nome</h3>
                <input type="text" id="nomeCadastro_ipt"><br>
                <h3>Email</h3>
                <input type="text" id="emailCadastro_ipt"><br>
                <h3>Senha</h3>
                <input type="text" id="senhaCadastro_ipt"><br>
                <h3>Confirme sua senha</h3>
                <input type="text" id="confimacaoSenhaCadastro_ipt">

            </div>

        

            <button id="cadastrar_btn" onclick="Cadastrar()">Cadastrar</button><br>
        </div>

        
    </div>
    
</body>
</html>
